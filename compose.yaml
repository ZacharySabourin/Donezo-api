services:
  donezo-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "10100:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PWD}
      TODO_DB: ${TODO_DB}
      JWT_SECRET: ${JWT_SECRET}
    extra_hosts:
      - "docker.host.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
  postgres:
    image: "postgres:latest"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PWD}
      POSTGRES_DB: ${TODO_DB}
    volumes:
      - ./config/postgres/initdb.d/:/docker-entrypoint-initdb.d/
    ports:
      - "10101:5432"
    labels:
      org.springframework.boot.jdbc.parameters: "ssl=true&sslmode=require"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${TODO_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
