spring.application.name=donezo-api

server.servlet.context-path=/api
server.port=8080

spring.jackson.property-naming-strategy=SNAKE_CASE

donezo.datasource.jdbc-url=jdbc:postgresql://postgres:5432/${TODO_DB}
donezo.datasource.username=${POSTGRES_USER}
donezo.datasource.password=${POSTGRES_PWD}
donezo.datasource.pool-size=30

donezo.access-control-allow.origin=http://localhost:5173
donezo.access-control-allow.methods=OPTIONS,GET,POST,PATCH,DELETE
donezo.access-control-allow.headers=Content-Type,Authorization,X-XSRF-TOKEN,X-CSRF-TOKEN
donezo.access-control-allow.credentials=true
donezo.access-control-allow.max-age=3600

donezo.jwt.secret=${JWT_SECRET}
donezo.jwt.expiration=900000
donezo.jwt.refresh-expiration=604800000
donezo.jwt.cookie=jwt-access
donezo.jwt.refresh=jwt-refresh

#---
spring.config.activate.on-profile=dev
server.port=8090

server.servlet.context-path=/api

logging.level.root=info

donezo.datasource.jdbc-url=jdbc:postgresql://localhost:10101/${TODO_DB}
donezo.datasource.username=${POSTGRES_USER}
donezo.datasource.password=${POSTGRES_PWD}
donezo.datasource.pool-size=30

donezo.access-control-allow.origin=http://localhost:5173
donezo.access-control-allow.methods=OPTIONS,GET,POST,PATCH,DELETE
donezo.access-control-allow.headers=Content-Type,Authorization,X-XSRF-TOKEN,X-CSRF-TOKEN
donezo.access-control-allow.credentials=true
donezo.access-control-allow.max-age=3600

donezo.jwt.secret=${JWT_SECRET}
donezo.jwt.expiration=900000
donezo.jwt.refresh-expiration=604800000
donezo.jwt.cookie=jwt-access
donezo.jwt.refresh=jwt-refresh

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.web.csrf=TRACE
